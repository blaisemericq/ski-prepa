<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prépa freeride</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d4e5f"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#eef2f4;--c:#fff;--t:#16232b;--m:#5d6e79;--a:#1d4e5f;--ok:#2f8f5b;--r:#c8372d;--b:#d5dde2;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0e161b;--c:#16222a;--t:#e6eef2;--m:#93a6b2;--a:#6cc4dc;--ok:#4cc38a;--r:#ff7a6b;--b:#2a3b45}}
*{box-sizing:inherit}html,body{margin:0}body{background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(80px + env(safe-area-inset-bottom,0))}
main{max-width:560px;margin:0 auto;padding:12px}h1{font-size:1.35rem;margin:4px 0}h2{font-size:1.05rem;margin:18px 0 8px}
.m{color:var(--m);font-size:.9rem}.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:8px 0}
.ex{display:flex;gap:10px;align-items:center;justify-content:space-between}.ex.on{border-color:var(--ok)}.ex b{display:block}
button,input,select{font:inherit;color:inherit}button{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 12px;min-height:44px}
button.on{background:var(--ok);color:#fff;border-color:var(--ok)}button.p{background:var(--a);color:var(--bg);border-color:var(--a)}
.row{display:flex;gap:6px;flex-wrap:wrap}.nav{display:flex;justify-content:space-between;align-items:center}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0)}.tabs button{flex:1;border:0;border-radius:0;background:none;min-height:56px}.tabs .on{color:var(--a);font-weight:700;background:none}
.pz{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}.pz input{width:100%}.pz.s .z{color:var(--r);font-weight:700}.v{display:block;text-align:center;font-size:.85rem}.v.al{color:var(--r);font-weight:700}
input[type=text],input[type=number],input[type=date]{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c)}
#tm{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0));background:var(--a);color:var(--bg);border-radius:10px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;font-size:1.3rem}
svg{width:100%;height:auto;background:var(--c);border:1px solid var(--b);border-radius:10px}
</style></head><body><main id="app"></main><div id="tm"><span id="tl"></span><button onclick="stopT()">Stop</button></div>
<nav class="tabs"><button onclick="go('t')" id="bt">Aujourd'hui</button><button onclick="go('a')" id="ba">Suivi</button><button onclick="go('s')" id="bs">Réglages</button></nav>
<script>
const $=s=>document.querySelector(s),Kf=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),Pd=k=>new Date(k+'T12:00'),
esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
mon=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
let S=JSON.parse(localStorage.getItem('ski1')||'null')||{start:Kf(mon(new Date())),thr:{kG:4,kD:4,aG:4,aD:3,gG:3,gD:3},log:{}};
const sv=()=>localStorage.setItem('ski1',JSON.stringify(S));
let V='t',cur=Kf(new Date());
// Programme : [nom, "texte B1|texte B2|texte B3" (vide = absent), unilatéral, "secondes par bloc"]
const MOB=["Grenouille, amplitude réduite","90/90 (rotations de hanche assis)","Fente basse avec ouverture","Papillon actif + cercles de hanche","Mobilité libre au choix"],
MT="2 min · doux, amplitude réduite (surtout à droite), sans douleur|2 min · amplitude et maintiens progressifs, sous 3/10|2 min · plus dynamique, toujours sans douleur d'aine";
const PR=[
{th:"Quadriceps & genoux",ex:[["Squat lent","2×8 · descente 3 s, genoux dans l'axe|3×8 · descente 4 s, pause 1 s|3×10 · descente 4 s, pause 2 s",0,0],["Chaise murale","3×20 s|3×30 s|3×40 s",0,"20,30,40"],["Squat assisté 1 jambe (main en appui)","|2×5 par côté, amplitude réduite|3×6 par côté",1,0]]},
{th:"Mollets & Achille",ex:[["Isométrique mollets 2 jambes (sur la pointe)","4×30 s|4×40 s|3×45 s",0,"30,40,45"],["Montées de mollets 2 jambes","2×10 · descente 3 s|3×12 · descente 4 s|3×15 · descente 4 s",0,0],["Montées de mollets 1 jambe","|2×8 par côté si Achille D ≤ 3/10|3×10 par côté",1,0],["Mobilité cheville (genou vers le mur)","2×10 par côté|2×12 par côté|2×12 par côté",1,0]]},
{th:"Ischios, fessiers, gainage",ex:[["Pont fessier","2×10|3×12 · maintien 2 s|3×15 · maintien 3 s",0,0],["Pont 1 jambe","|2×6 par côté|3×8 par côté",1,0],["Planche","3×20 s|3×30 s|3×40 s",0,"20,30,40"],["Planche latérale (genou posé au début)","2×15 s par côté|3×20 s par côté|3×30 s par côté",1,"15,20,30"]]},
{th:"Équilibre & stabilité",ex:[["Équilibre 1 jambe","3×30 s par côté|3×30 s, yeux fermés|3×30 s sur coussin instable",1,"30,30,30"],["Fente arrière contrôlée","2×6 par côté|3×8 par côté, descente 3 s|3×8 par côté, tempo 4 s",1,0],["Petits sauts, réception silencieuse","||3×5 · seulement si Achille D ≤ 3/10 (à valider)",0,0]]},
{th:"Circuit mixte",ex:[["Squat lent","1×8|2×8|2×10",0,0],["Pont fessier","1×10|2×10|2×12",0,0],["Équilibre 1 jambe","2×20 s par côté|2×30 s par côté|2×30 s sur coussin",1,"20,30,30"],["Montées de mollets 2 jambes","1×10 · descente lente|2×12|2×15",0,0]]}];
const ZN=[["Genou","k"],["Achille","a"],["Aine","g"]],ZS=["kG","aD","gD"],ZK=["kG","kD","aG","aD","gG","gD"];
function info(k){const d=Pd(k),w=Math.floor((d-Pd(S.start))/6048e5)+1,b=Math.min(3,Math.max(1,Math.ceil(w/4)));return{d,wd:(d.getDay()+6)%7,w:Math.max(w,1),b}}
function items(k){const i=info(k),p=PR[i.wd];if(!p)return[];const L=p.ex.map((e,n)=>({id:n,n:e[0],t:e[1].split('|')[i.b-1],u:e[3]?e[2]:e[2],h:e[3]?+e[3].split(',')[i.b-1]:0,u:e[2]})).filter(x=>x.t);
L.push({id:'m',n:"Mobilité hanches : "+MOB[i.wd],t:MT.split('|')[i.b-1],u:0,h:0});return L}
const E=k=>S.log[k]||(S.log[k]={d:{},pain:{}}),cnt=k=>{const e=S.log[k];if(!e)return 0;return Object.values(e.d||{}).filter(Boolean).length};
function done(k){const e=S.log[k];if(!e)return false;const m=e.mode||'maison';return m=='maison'?cnt(k)>0:!!e.fait}
function go(v){V=v;draw()}
function tog(id){const e=E(cur);e.d[id]=e.d[id]?0:1;sv();draw()}
function setM(m){const e=E(cur);e.mode=m;sv();draw()}
function shift(n){const d=Pd(cur);d.setDate(d.getDate()+n);cur=Kf(d);draw()}
function draw(){['t','a','s'].forEach(x=>$('#b'+x).className=x==V?'on':'');$('#app').innerHTML=V=='t'?today():V=='a'?stats():sets()}
function today(){const i=info(cur),e=S.log[cur]||{d:{},pain:{}},we=i.wd>4,m=e.mode||(we?'repos':'maison'),L=items(cur),n=L.reduce((s,x)=>s+(x.u?2:1),0),f=cnt(cur);
let h=`<div class="nav"><button onclick="shift(-1)">◀</button><div style="text-align:center"><h1>${i.d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h1><span class="m">Semaine ${i.w} · bloc ${i.b}${PR[i.wd]&&m=='maison'?' · '+PR[i.wd].th:''}</span></div><button onclick="shift(1)">▶</button></div>
<div class="row" style="margin:8px 0">${[['maison','Maison'],['piscine','Piscine'],['marche','Marche']].map(a=>`<button class="${m==a[0]?'p':''}" onclick="setM('${a[0]}')">${a[1]}</button>`).join('')}</div>`;
if(m=='repos')h+=`<div class="card">Jour de repos. Tu peux quand même noter une piscine ou une marche ci-dessus.</div>`;
else if(m=='maison'){h+=`<p class="m">${f}/${n} faits · 5–10 min</p>`;L.forEach(x=>{const ok=x.u?e.d[x.id+'G']&&e.d[x.id+'D']:e.d[x.id];h+=`<div class="card ex ${ok?'on':''}"><div><b>${esc(x.n)}</b><span class="m">${esc(x.t)}</span>${x.h?` <button onclick="startT(${x.h})">⏱ ${x.h} s</button>`:''}</div><div class="row">${x.u?['G','D'].map(s=>`<button class="${e.d[x.id+s]?'on':''}" onclick="tog('${x.id+s}')">${s}</button>`).join(''):`<button class="${e.d[x.id]?'on':''}" onclick="tog('${x.id}')">✓</button>`}</div></div>`})}
else h+=`<div class="card"><b>${m=='marche'?'Marche sur tapis':'Piscine'}</b><p class="m">${m=='marche'?'À plat, 0 % de pente, 20–30 min, allure confortable. Stop si Achille D > 3/10.':'Nage douce 20–30 min, crawl ou dos. Éviter la brasse (genou et aine), à valider avec ton kiné.'}</p><div class="row"><button class="${e.fait?'on':''}" onclick="E(cur).fait=!E(cur).fait;sv();draw()">Séance faite</button><input type="number" placeholder="minutes" value="${e.min||''}" style="width:110px" onchange="E(cur).min=this.value;sv()"></div></div>`;
h+=`<h2>Douleur en fin de séance</h2><div class="row"><button onclick="ras()">RAS (tout à 0)</button><button onclick="clr()">Effacer</button></div><div class="pz m"><span></span><span class="v">Gauche</span><span class="v">Droite</span></div>`;
ZN.forEach(z=>{h+=`<div class="pz ${ZS.includes(z[1]+'G')||ZS.includes(z[1]+'D')?'s':''}"><span class="z">${z[0]}</span>`+['G','D'].map(s=>{const c=z[1]+s,v=e.pain[c],al=v!=null&&v>S.thr[c];return`<div><input type="range" min="0" max="10" value="${v??0}" oninput="pn('${c}',this.value)"><span class="v ${al?'al':''}" id="v${c}">${v==null?'–':v+'/10'}</span></div>`}).join('')+`</div>`});
h+=`<p class="m">Sensibles : genou G, Achille D, aine D. Rouge = seuil dépassé.</p><input type="text" placeholder="Exercice qui a gêné (optionnel)" value="${esc(e.gene)}" onchange="E(cur).gene=this.value;sv()"><input type="text" style="margin-top:8px" placeholder="Note (optionnel)" value="${esc(e.note)}" onchange="E(cur).note=this.value;sv()">`;return h}
function pn(c,v){E(cur).pain[c]=+v;sv();const s=$('#v'+c);s.textContent=v+'/10';s.className='v'+(v>S.thr[c]?' al':'')}
function ras(){ZK.forEach(c=>E(cur).pain[c]=0);sv();draw()}function clr(){E(cur).pain={};sv();draw()}
let TI,TE;function startT(s){stopT();TE=Date.now()+s*1e3;$('#tm').style.display='flex';const u=()=>{const r=Math.ceil((TE-Date.now())/1e3);if(r<=0){$('#tl').textContent='Terminé';navigator.vibrate&&navigator.vibrate([300,100,300]);clearInterval(TI);setTimeout(stopT,3e3)}else $('#tl').textContent=r+' s'};u();TI=setInterval(u,250)}
function stopT(){clearInterval(TI);$('#tm').style.display='none'}
function stats(){const ks=Object.keys(S.log).sort(),wk={};ks.forEach(k=>{const w=info(k).w;wk[w]=wk[w]||[0,0];if(done(k))wk[w][0]++;});
let h=`<h1>Suivi</h1><h2>Régularité</h2>`;const ws=Object.keys(wk).slice(-8);h+=ws.length?ws.map(w=>`<div class="card">Semaine ${w} : ${'●'.repeat(wk[w][0])||'–'} <span class="m">${wk[w][0]} séance(s)</span></div>`).join(''):`<p class="m">Aucune donnée pour l'instant.</p>`;
const pk=ks.filter(k=>Object.keys(S.log[k].pain||{}).length).slice(-60);h+=`<h2>Douleur (0–10)</h2>`;
if(pk.length){const C={kG:'#2563eb',aD:'#dc2626',gD:'#d97706',kD:'#9aa',aG:'#9aa',gG:'#9aa'},W=320,n=Math.max(pk.length-1,1);let sv_='';ZK.forEach(c=>{const pts=pk.map((k,i)=>[i,S.log[k].pain[c]]).filter(p=>p[1]!=null).map(p=>`${10+p[0]/n*300},${130-p[1]*12}`).join(' ');if(pts)sv_+=`<polyline points="${pts}" fill="none" stroke="${C[c]}" stroke-width="${ZS.includes(c)?2.5:1.2}" ${ZS.includes(c)?'':'stroke-dasharray="4"'}/>`});
h+=`<svg viewBox="0 0 ${W} 140">${sv_}</svg><p class="m"><span style="color:#2563eb">■</span> Genou G <span style="color:#dc2626">■</span> Achille D <span style="color:#d97706">■</span> Aine D · gris pointillé : autres côtés</p>`;
const r=pk.slice(-14);h+=`<div class="card">Moyenne des 14 derniers relevés<br>`+ZN.map(z=>{const a=s=>{const v=r.map(k=>S.log[k].pain[z[1]+s]).filter(x=>x!=null);return v.length?(v.reduce((x,y)=>x+y,0)/v.length).toFixed(1):'–'};return`${z[0]} G ${a('G')} / D ${a('D')}`}).join('<br>')+`</div>`}else h+=`<p class="m">Renseigne le score de douleur pour voir les courbes.</p>`;
return h+`<h2>Données</h2><div class="row"><button onclick="exp('csv')">Export CSV</button><button onclick="exp('json')">Export JSON</button><button onclick="$('#imp').click()">Importer JSON</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"><p class="m">Les données restent sur ce téléphone : exporte régulièrement (synchro GitHub à venir).</p>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(f){if(f=='json')return dl('ski-log.json',JSON.stringify(S,null,1),'application/json');const R=['date,mode,semaine,bloc,exercices_faits,'+ZK.join(',')+',gene,note'];Object.keys(S.log).sort().forEach(k=>{const e=S.log[k],i=info(k);R.push([k,e.mode||'maison',i.w,i.b,cnt(k),...ZK.map(c=>e.pain[c]??''),'"'+(e.gene||'').replace(/"/g,'""')+'"','"'+(e.note||'').replace(/"/g,'""')+'"'].join(','))});dl('ski-log.csv',R.join('\n'),'text/csv')}
function imp(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.log)throw 0;S=o;sv();draw()}catch{alert('Fichier invalide')}};r.readAsText(f)}
function sets(){return`<h1>Réglages</h1><div class="card"><b>Lundi de la semaine 1</b><input type="date" value="${S.start}" onchange="S.start=Kf(mon(Pd(this.value)));sv()"></div><div class="card"><b>Seuils d'alerte (0–10)</b><p class="m">À fixer avec ton kiné.</p>${ZK.map(c=>`<div class="pz" style="grid-template-columns:1fr 80px"><span>${ZN.find(z=>z[1]==c[0])[0]} ${c[1]=='G'?'gauche':'droite'}</span><input type="number" min="0" max="10" value="${S.thr[c]}" onchange="S.thr['${c}']=+this.value;sv()"></div>`).join('')}</div><p class="m">Programme de 12 semaines (3 blocs de 4). Au-delà, le bloc 3 continue. Contenu à faire valider par ton kiné.</p>`}
draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
